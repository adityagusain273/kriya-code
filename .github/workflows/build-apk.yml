name: Android CI — analyze, test, signed build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

jobs:
  gate:
    name: Analyze + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h / | tail -1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: TLS trust-anchor check
        run: dart run tool/check_cert_pins.dart

      - name: Debug build (compile gate)
        run: flutter build apk --debug -Pbcode.sideload=true

  release:
    name: Signed release artifacts (aab + apk)
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      HAS_SECRETS: ${{ secrets.BCODE_UPLOAD_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h / | tail -1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Require OAuth client id
        run: |
          if [ -z "${{ secrets.BCODE_CLIENT_ID }}" ]; then
            echo "::error::BCODE_CLIENT_ID is empty. A release build without it installs but cannot start."
            exit 1
          fi

      - name: Restore release signing key
        if: ${{ env.HAS_SECRETS == 'true' }}
        run: |
          echo "${{ secrets.BCODE_UPLOAD_KEYSTORE_B64 }}" | base64 -d > android/key.jks
          cat > android/key.properties <<'EOF'
          storeFile=key.jks
          storePassword=
          keyAlias=
          keyPassword=
          EOF
          sed -i "s/^storePassword=$/storePassword=${{ secrets.BCODE_KEYSTORE_PASSWORD }}/" android/key.properties
          sed -i "s/^keyAlias=$/keyAlias=${{ secrets.BCODE_KEY_ALIAS }}/" android/key.properties
          sed -i "s/^keyPassword=$/keyPassword=${{ secrets.BCODE_KEY_PASSWORD }}/" android/key.properties

      # APK first: it is the sideload/test artifact. The bundle's post-build
      # strip check is stricter, and its failure must not hide the APK.
      - name: Build APK (direct distribution)
        if: ${{ env.HAS_SECRETS == 'true' }}
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=GITHUB_CLIENT_ID=${{ secrets.BCODE_CLIENT_ID }}

      - name: Build app bundle (Play)
        if: ${{ env.HAS_SECRETS == 'true' }}
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=GITHUB_CLIENT_ID=${{ secrets.BCODE_CLIENT_ID }}

      - name: Diagnose bundle strip verification
        if: ${{ always() && env.HAS_SECRETS == 'true' }}
        run: |
          set +e
          analyzer="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/apkanalyzer 2>/dev/null | tail -1)"
          echo "apkanalyzer=${analyzer:-missing}"
          ls -la build/app/outputs/bundle/release/ 2>/dev/null
          if [ -n "$analyzer" ]; then
            "$analyzer" files list build/app/outputs/bundle/release/app-release.aab \
              | grep -E "lib(flutter|app)\.so" | head -20
          fi

      - name: Verify Dart symbol files (crash symbolication)
        if: ${{ always() && env.HAS_SECRETS == 'true' }}
        run: |
          set -euo pipefail
          ls build/symbols/app.android-*.symbols
          echo "Dart symbol files present for symbolication of crash reports"

      - name: Unsigned debug build (no secrets yet)
        if: ${{ env.HAS_SECRETS != 'true' }}
        run: flutter build apk --debug -Pbcode.sideload=true

      - name: Verify the release APK is signed with the release key
        if: ${{ always() && env.HAS_SECRETS == 'true' }}
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          signer="$("$apksigner" verify --print-certs "$apk" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2}' \
            | tr -d ':' | tr 'A-Z' 'a-z')"
          expected="$(keytool -list -v -keystore android/key.jks \
            -storepass "${{ secrets.BCODE_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.BCODE_KEY_ALIAS }}" \
            | awk -F': ' '/SHA256:/ {print $2}' \
            | tr -d ':' | tr 'A-Z' 'a-z')"
          if [ -z "$signer" ] || [ -z "$expected" ] || [ "$signer" != "$expected" ]; then
            echo "the release APK is not signed with the release key"
            echo "apk signer:   ${signer:-none}"
            echo "keystore:     ${expected:-none}"
            exit 1
          fi
          echo "release APK signed with the release key: $signer"

      - name: Report 16 KB page-size alignment
        if: ${{ always() && env.HAS_SECRETS == 'true' }}
        run: |
          status=0
          for so in "$HOME"/.pub-cache/hosted/pub.dev/git2dart_binaries-*/android/src/main/jniLibs/{arm64-v8a,x86_64}/lib*.so; do
            for a in $(readelf -lW "$so" | awk '/LOAD/{gsub(/.* align /,""); print $NF}'); do
              case "$a" in
                0x4000|2**14) echo "ALIGNED   ${so##*jniLibs/}: $a" ;;
                *) echo "UNALIGNED ${so##*jniLibs/}: $a"; status=1 ;;
              esac
            done
          done
          if [ "$status" -ne 0 ]; then
            echo
            echo "Some prebuilt libs are 4 KB-aligned — an upstream problem in"
            echo "git2dart_binaries (its own published .so files, not our build)."
            echo "16 KB backcompat mode keeps them functional; the policy debt"
            echo "status is documented in store/16kb.md."
          fi

      - name: Upload bundle
        if: ${{ always() && env.HAS_SECRETS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: b-code-release-bundle
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload Dart symbol file (for crash symbolication)
        if: ${{ always() && env.HAS_SECRETS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: b-code-release-symbols
          path: build/symbols/
          retention-days: 90

      - name: Upload APK
        if: ${{ always() && env.HAS_SECRETS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: b-code-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload unsigned debug APK
        if: ${{ env.HAS_SECRETS != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: b-code-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Release note (how to publish)
        if: ${{ env.HAS_SECRETS != 'true' }}
        run: |
          {
            echo "## No signing secrets configured"
            echo "Only analyze/test/debug artifacts were produced."
            echo ""
            echo "To produce the Play bundle, add these repository secrets:"
            echo "- \`BCODE_UPLOAD_KEYSTORE_B64\` — base64 of \`android/key.jks\` (\`base64 -w0 android/key.jks\`)"
            echo "- \`BCODE_KEYSTORE_PASSWORD\`"
            echo "- \`BCODE_KEY_ALIAS\`  (bcode)"
            echo "- \`BCODE_KEY_PASSWORD\`"
            echo "- \`BCODE_CLIENT_ID\` — OAuth app client id (device flow)"
          } > NOTE.md
          cat NOTE.md
