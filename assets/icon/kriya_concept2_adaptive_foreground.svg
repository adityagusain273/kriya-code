<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Stem: Electric Indigo -->
    <linearGradient id="stem2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Upper Chevron: Tech Saffron / Solar Flare -->
    <linearGradient id="saffronGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Lower Chevron: Cyber Violet / Cyan Glow -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Ambient light -->
  <circle cx="340" cy="180" r="80" fill="#F97316" opacity="0.18" filter="blur(25px)" />
  <circle cx="330" cy="350" r="80" fill="#06B6D4" opacity="0.18" filter="blur(25px)" />

  <!-- Vector Folded K -->
  <g transform="translate(16, 0)">
    <!-- Stem -->
    <rect x="130" y="128" width="50" height="256" rx="25" fill="url(#stem2)" />
    
    <!-- Upper Diagonal: Angular Code Vector (Folded Saffron) -->
    <path d="M 195 240 
             L 325 130 
             C 338 120 358 126 364 142 
             C 370 156 364 172 350 184 
             L 248 266 
             Z" 
          fill="url(#saffronGrad)" />

    <!-- Lower Diagonal: Forward Terminal Arrow (Folded Violet to Cyan) -->
    <path d="M 230 248 
             L 345 345 
             C 358 356 360 376 348 390 
             C 336 402 316 402 304 390 
             L 195 292 
             Z" 
          fill="url(#violetGrad)" />
  </g>
</svg>
