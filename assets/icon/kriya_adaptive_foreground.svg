<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Stem Gradient (Electric Cyan to Blue) -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Top Bracket Arm Gradient (Cyan to Indigo) -->
    <linearGradient id="topArmGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Bottom Run / Play Wedge Gradient (Vibrant Emerald to Lime) -->
    <linearGradient id="runGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind K -->
  <circle cx="280" cy="270" r="110" fill="#2563EB" opacity="0.20" filter="blur(25px)" />
  <circle cx="320" cy="340" r="90" fill="#00E676" opacity="0.18" filter="blur(25px)" />

  <!-- The "K" Mark -->
  <g>
    <!-- Left Vertical Stem (Code Cursor) -->
    <rect x="136" y="128" width="52" height="256" rx="26" fill="url(#stemGrad)" />

    <!-- Upper Arm: Code Angle Bracket Chevron (<) -->
    <path d="M 204 268 
             L 316 148 
             A 26 26 0 0 1 354 184 
             L 258 286 
             Z" 
          fill="url(#topArmGrad)" />

    <!-- Lower Arm: Dynamic Run / Play Wedge (▶) -->
    <path d="M 232 254 
             L 346 348 
             A 24 24 0 0 1 330 384 
             L 204 316 
             Z" 
          fill="url(#runGrad)" />
          
    <!-- Subtle Play Arrow Dot / Accent -->
    <circle cx="356" cy="358" r="8" fill="#00E676" opacity="0.9" />
  </g>
</svg>
